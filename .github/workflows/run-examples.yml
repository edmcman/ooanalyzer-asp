name: Run Examples

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  run-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gringo python3

      - name: Run hand-written examples
        run: |
          mkdir -p outputs
          for f in examples/*.lp; do
            name=$(basename "$f" .lp)
            echo "=== Running $f ===" > "outputs/${name}.txt"
            clingo ooanalyzer.lp "$f" --quiet=1,2 >> "outputs/${name}.txt" 2>&1 || true
          done

      - name: Convert and run OOAnalyzer examples
        run: |
          mkdir -p outputs/ooa
          make clean
          make run 2>&1 | tee outputs/ooa/make-run.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clingo-example-outputs
          path: outputs/
