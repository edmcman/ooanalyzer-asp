name: Run Examples

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  run-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gringo python3

      - name: Run hand-written examples
        run: |
          mkdir -p outputs
          for f in examples/*.lp; do
            name=$(basename "$f" .lp)
            echo "=== Running $f ===" > "outputs/${name}.txt"
            rc=0
            clingo ooanalyzer.lp "$f" --quiet=1,2 >> "outputs/${name}.txt" 2>&1 || rc=$?
            case "$rc" in
              0|10|20|30) ;;
              *) cat "outputs/${name}.txt"; exit "$rc" ;;
            esac
          done

      - name: Verify markers
        run: |
          mkdir -p outputs/ooa
          make verify 2>&1 | tee outputs/ooa/make-verify.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clingo-example-outputs
          path: outputs/
